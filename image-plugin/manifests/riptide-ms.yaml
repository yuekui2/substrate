# Riptide image plugin DaemonSet whose gcfsd-v2 reads blocks through a
# Memorystore for Valkey cluster shared by all nodes. Benchmark only.
#
# A copy of riptide.yaml with these differences:
# - gcfsd-v2 runs with --use_memorystore and --redis_cluster_address set to
#   MEMORYSTORE_ADDRESS, the instance's discovery endpoint (host:port).
# - gcfsd-v2 keeps its local cache (--use_local_cache) but no layer cache.
# - RIPTIDE_BIN_DIR must point at a gcfsd-v2 build with Memorystore support.
#
# The plugin runs with hostNetwork, so NetworkPolicy does not apply to its
# connections to Memorystore.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: image-plugin-riptide-ms
  namespace: ate-system
  labels:
    app: ate-image-plugin
    ate.dev/image-plugin: riptide-ms
spec:
  selector:
    matchLabels:
      app: ate-image-plugin
      ate.dev/image-plugin: riptide-ms
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app: ate-image-plugin
        ate.dev/image-plugin: riptide-ms
    spec:
      hostPID: true
      hostNetwork: true
      terminationGracePeriodSeconds: 3600
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      containers:
      - name: riptide-provider
        image: debian:13-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
        env:
        - name: KUBE_HOME
          value: /home/kubernetes
        # Set to the Memorystore discovery endpoint, e.g. 10.0.0.5:6379.
        - name: MEMORYSTORE_ADDRESS
          value: ""
        # Set to "true" for a cold start, e.g. for benchmarks.
        - name: CLEAR_CACHE_ON_START
          value: "false"
        command:
        - nsenter
        - -t
        - "1"
        - -m
        - -u
        - -i
        - -n
        - --
        - /bin/bash
        - -ec
        - |
          readonly gcfs_root="/var/lib/ate/image-plugin-cache/riptide-gcfs"
          readonly gcfs_run_dir="/run/ate/gcfsd"
          readonly gcfsd_mnt_dir="${gcfs_root}/mnt"

          if [[ -z "${MEMORYSTORE_ADDRESS:-}" ]]; then
            echo "MEMORYSTORE_ADDRESS is not set" >&2
            exit 1
          fi
          bin_dir="${RIPTIDE_BIN_DIR:-${KUBE_HOME}/bin}"
          export GCFSD_BIN="${bin_dir}/gcfsd-v2"
          export GCFS_SNAPSHOTTER_BIN="${bin_dir}/containerd-gcfs-grpc"
          for bin in "${GCFSD_BIN}" "${GCFS_SNAPSHOTTER_BIN}"; do
            if [[ ! -x "${bin}" ]]; then
              echo "Riptide binary ${bin} is missing or not executable" >&2
              exit 1
            fi
          done
          echo "Using gcfsd ${GCFSD_BIN} ($(timeout 5 "${GCFSD_BIN}" --build_number 2>&1 | head -1)) and snapshotter ${GCFS_SNAPSHOTTER_BIN}"

          # The kernel truncates process names to 15 characters.
          for name in gcfsd-v2 containerd-gcfs-grpc; do
            for pid in $(pgrep -x "${name:0:15}" || true); do
              if tr '\0' ' ' < "/proc/${pid}/cmdline" 2>/dev/null | grep -q "${gcfs_root}"; then
                kill -9 "${pid}" 2>/dev/null || true
              fi
            done
          done

          umount -l "${gcfsd_mnt_dir}" 2>/dev/null || true
          # See riptide.yaml for why the view state is always cleared.
          cache_version="$(cat "${GCFSD_BIN}" "${GCFS_SNAPSHOTTER_BIN}" | sha256sum | cut -c1-16)"
          clear_reason=""
          if [[ "${CLEAR_CACHE_ON_START:-false}" == "true" ]]; then
            clear_reason="CLEAR_CACHE_ON_START=true"
          elif [[ "$(cat "${gcfs_root}/version" 2>/dev/null)" != "${cache_version}" ]]; then
            clear_reason="provider cache version changed to ${cache_version}"
          fi
          if [[ -n "${clear_reason}" ]]; then
            echo "Clearing the local cache: ${clear_reason}"
            rm -rf "${gcfs_root}/snapshotter/layers"
          fi
          rm -rf "${gcfs_root}/gcfsd" "${gcfs_root}/gcfsd_sentinel.txt" \
            "${gcfs_root}/snapshotter/metadata.db" "${gcfs_root}/snapshotter/snapshots" \
            /var/lib/ate/image-plugin-cache/riptide/*
          mkdir -p /run/ate "${gcfs_run_dir}" "${gcfs_root}" "${gcfsd_mnt_dir}" /run/gcfsd /var/lib/ate/image-plugin-cache/riptide
          echo "${cache_version}" > "${gcfs_root}/version"
          rm -f "${gcfs_run_dir}/grpc.sock" "${gcfs_run_dir}/keychain.sock" "${gcfs_run_dir}/downloader.sock" /run/ate/gcfs-snapshotter.sock /run/ate/drain-complete

          if ! mountpoint -q "${gcfs_root}"; then
            mount --bind "${gcfs_root}" "${gcfs_root}"
          fi
          mount --make-rshared "${gcfs_root}"

          exec unshare -m --propagation unchanged -- /bin/bash -ec '
            readonly gcfs_root="/var/lib/ate/image-plugin-cache/riptide-gcfs"
            readonly gcfsd_mnt_dir="${gcfs_root}/mnt"
            readonly gcfs_socket_path="/run/gcfsd/grpc.sock"
            readonly images_in_use_db_path="${gcfs_root}/gcfsd/images_in_use.db"
            readonly sentinel_file_path="${gcfs_root}/gcfsd_sentinel.txt"

            mount --make-rslave /run
            mount --bind /run/ate/gcfsd /run/gcfsd
            mount --make-private /run/gcfsd

            gcfs_cache_size_flag=""
            if [[ -n "${GCFSD_CACHE_SIZE_MIB:-}" ]]; then
              each_cache_size=$((GCFSD_CACHE_SIZE_MIB / 2))
              gcfs_cache_size_flag="--max_content_cache_size_mb=${each_cache_size} --max_large_files_cache_size_mb=${each_cache_size}"
            fi

            client_version_flag=""
            if [[ -n "${KUBELET_VERSION:-}" ]]; then
              client_version_flag="--client_version=${KUBELET_VERSION}"
            fi

            gcfs_read_ahead_flag="--enable_single_flighting=true --read_ahead_max_blocks=10 --read_ahead_cache_size_ratio=0.1"
            gcfs_memorystore_flag="--layer_cache_dir= --use_local_cache=true --use_memorystore=true --redis_cluster_address=${MEMORYSTORE_ADDRESS} --memorystore_opt_stage=1"

            if [[ -f "${KUBE_HOME}/gcfsd_application_default_credentials.json" ]]; then
              export GCFSD_METRICS_ADC_CONFIG_PATH="${KUBE_HOME}/gcfsd_application_default_credentials.json"
            fi

            mkdir -p "${gcfsd_mnt_dir}" "$(dirname "${images_in_use_db_path}")"

            gcfsd_pid=""
            snapshotter_pid=""
            cleanup() {
              kill -TERM ${snapshotter_pid} ${gcfsd_pid} 2>/dev/null || true
              wait ${snapshotter_pid} ${gcfsd_pid} 2>/dev/null || true
              umount -l "${gcfsd_mnt_dir}" 2>/dev/null || true
              rm -f /run/ate/gcfs-snapshotter.sock "${gcfs_socket_path}" /run/gcfsd/keychain.sock /run/gcfsd/downloader.sock
            }
            trap cleanup TERM INT EXIT

            GOGC=10 "${GCFSD_BIN}" \
              --mount_point="${gcfsd_mnt_dir}" \
              --control_server_socket_path="${gcfs_socket_path}" \
              --downloader_uds_path=/run/gcfsd/downloader.sock \
              --sentinel_file_path="${sentinel_file_path}" \
              --containerd_uds_path="" \
              --event_reporter_type=none \
              --port=11254 \
              ${gcfs_cache_size_flag} \
              --images_in_use_db_path="${images_in_use_db_path}" \
              --enable_pull_secret_keychain \
              --client_name=GKE \
              ${client_version_flag} \
              ${gcfs_read_ahead_flag} \
              ${gcfs_memorystore_flag} &
            gcfsd_pid=$!

            for _ in $(seq 1 150); do
              [[ -S "${gcfs_socket_path}" && -S /run/gcfsd/keychain.sock ]] && break
              sleep 0.1
            done

            mkdir -p /etc/containerd-gcfs-grpc
            touch "${gcfs_root}/config.toml"
            export HOME=/root
            if [[ -f "${KUBE_HOME}/gcfs_snaphotter_application_default_credentials.json" ]]; then
              export GCFS_SNAPSHOTTER_METRICS_ADC_CONFIG_PATH="${KUBE_HOME}/gcfs_snaphotter_application_default_credentials.json"
            fi

            rm -f /run/ate/gcfs-snapshotter.sock
            "${GCFS_SNAPSHOTTER_BIN}" \
              --log-level=info \
              --config="${gcfs_root}/config.toml" \
              --address=/run/ate/gcfs-snapshotter.sock \
              --root="${gcfs_root}" \
              --gcfs-socket-path="${gcfs_socket_path}" \
              --enable-kubernetes-event-reporting=false \
              --disable-duplicate-layer-support=false \
              --enable-metric-exporter=false \
              --enable-v2 &
            snapshotter_pid=$!
            wait -n "${gcfsd_pid}" "${snapshotter_pid}"
          '
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - while [ ! -f /run/ate/drain-complete ]; do sleep 0.5; done
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - test -S /run/ate/gcfs-snapshotter.sock && test -S /run/ate/gcfsd/keychain.sock && test -S /run/ate/image-plugin.sock
          initialDelaySeconds: 2
          periodSeconds: 2
        securityContext:
          privileged: true
        volumeMounts:
        - name: kube-home
          mountPath: /home/kubernetes
          readOnly: true
        - name: run-ate
          mountPath: /run/ate
        - name: ate-base
          mountPath: /var/lib/ate
          mountPropagation: Bidirectional
        - name: dev-fuse
          mountPath: /dev/fuse
      - name: image-plugin-riptide
        image: ko://go.ate.dev/substrate/image-plugin/cmd/riptide
        args:
        - --listen-socket=/run/ate/image-plugin.sock
        - --snapshotter-socket=/run/ate/gcfs-snapshotter.sock
        - --keychain-socket=/run/ate/gcfsd/keychain.sock
        - --work-dir=/var/lib/ate/image-plugin-cache/riptide
        - --idle-ttl=10m
        - --startup-timeout=2m
        - --drain-timeout=30m
        - --drain-complete-file=/run/ate/drain-complete
        readinessProbe:
          exec:
            command:
            - /ko-app/riptide
            - --probe
            - --listen-socket=/run/ate/image-plugin.sock
          initialDelaySeconds: 2
          periodSeconds: 2
        securityContext:
          privileged: true
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: run-ate
          mountPath: /run/ate
        - name: ate-base
          mountPath: /var/lib/ate
          mountPropagation: HostToContainer
      volumes:
      - name: kube-home
        hostPath:
          path: /home/kubernetes
          type: Directory
      - name: run-ate
        hostPath:
          path: /run/ate
          type: DirectoryOrCreate
      - name: ate-base
        hostPath:
          path: /var/lib/ate
          type: DirectoryOrCreate
      - name: dev-fuse
        hostPath:
          path: /dev/fuse
          type: CharDevice
