# Full Cross-Node Nydus RAFS v6 + Dragonfly v2 P2P Stack over Kernel EROFS + fscache.
#
# Deploys:
# 1. Dragonfly v2.5 Cluster Control Plane in ate-system:
#    - dragonfly-mysql + dragonfly-redis (backing store for Dragonfly Manager)
#    - dragonfly-manager (REST :8080 / gRPC :65003)
#    - dragonfly-scheduler (gRPC :8002, metrics :8000)
# 2. Per-Node Data Plane DaemonSet (image-plugin-nydus-dragonfly) on every worker
#    node, or image-plugin-nydus-dragonfly-seed on nodes labeled
#    ate.dev/dragonfly-seed=true:
#    - dfdaemon, the Rust Dragonfly client (registry mirror proxy on
#      127.0.0.1:4001 for local nydusd, upload gRPC :4000, piece storage
#      :4005/tcp and :4006/udp for peers, metrics :4002, health :4003)
#    - nydus-snapshotter (containerd-nydus-grpc + nydusd singleton in Kernel EROFS
#      + fscache mode, using the dfdaemon proxy as a registry mirror)
#    - image-plugin-dragonfly (ImagePlugin gRPC plugin on
#      /run/ate/image-plugin.sock)
#
# Userspace FUSE (fusedev) fallback is strictly disabled: if Kernel EROFS or
# /dev/cachefiles is unavailable, the containers fail fast with an explicit error.
#
# On kernels without on-demand fscache, such as GKE Ubuntu, the
# build-erofs-modules init container builds erofs and cachefiles on first start
# for each kernel. It needs egress to the Ubuntu archive and launchpad.net, and
# Shielded VM secure boot off so insmod accepts the unsigned modules.
apiVersion: v1
kind: Service
metadata:
  name: dragonfly-redis
  namespace: ate-system
  labels:
    app: dragonfly-redis
    ate.dev/image-plugin: nydus-dragonfly
spec:
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  selector:
    app: dragonfly-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonfly-redis
  namespace: ate-system
  labels:
    app: dragonfly-redis
    ate.dev/image-plugin: nydus-dragonfly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly-redis
  template:
    metadata:
      labels:
        app: dragonfly-redis
        ate.dev/image-plugin: nydus-dragonfly
    spec:
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      containers:
      - name: redis
        image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        args:
        - redis-server
        - --requirepass
        - dragonfly
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly-mysql
  namespace: ate-system
  labels:
    app: dragonfly-mysql
    ate.dev/image-plugin: nydus-dragonfly
spec:
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
  selector:
    app: dragonfly-mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonfly-mysql
  namespace: ate-system
  labels:
    app: dragonfly-mysql
    ate.dev/image-plugin: nydus-dragonfly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly-mysql
  template:
    metadata:
      labels:
        app: dragonfly-mysql
        ate.dev/image-plugin: nydus-dragonfly
    spec:
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      containers:
      - name: mysql
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: dragonfly
        - name: MYSQL_DATABASE
          value: manager
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dragonfly-controlplane-config
  namespace: ate-system
  labels:
    ate.dev/image-plugin: nydus-dragonfly
data:
  manager.yaml: |
    server:
      rest:
        addr: :8080
      grpc:
        listenIP: 0.0.0.0
        port:
          start: 65003
          end: 65003
    auth:
      jwt:
        realm: Dragonfly
        key: ZHJhZ29uZmx5Cg==
        timeout: 48h
        maxRefresh: 48h
    database:
      type: mysql
      mysql:
        user: root
        password: dragonfly
        host: dragonfly-mysql.ate-system.svc.cluster.local
        port: 3306
        dbname: manager
        migrate: true
      redis:
        addrs:
        - dragonfly-redis.ate-system.svc.cluster.local:6379
        password: dragonfly
        db: 0
        brokerDB: 1
        backendDB: 2
    cache:
      redis:
        ttl: 30s
      local:
        size: 10000
        ttl: 30s
    metrics:
      enable: false
    console: true
  scheduler.yaml: |
    server:
      listenIP: 0.0.0.0
      port: 8002
      advertisePort: 8002
    scheduler:
      algorithm: default
      # A peer may go to the registry while at most backToSourceCount peers
      # of the task have. The rest download pieces from them. Seeds are
      # preloaded, so a piece with no parent is rare: go to the registry
      # after one lookup instead of waiting for one.
      backToSourceCount: 3
      retryBackToSourceLimit: 1
      retryLimit: 20
      retryInterval: 100ms
      gc:
        pieceDownloadTimeout: 30m
        peerGCInterval: 10m
        peerTTL: 24h
        taskGCInterval: 10m
        hostGCInterval: 30m
        hostTTL: 48h
    manager:
      addr: dragonfly-manager.ate-system.svc.cluster.local:65003
      schedulerClusterID: 1
      keepAlive:
        interval: 5s
    dynConfig:
      refreshInterval: 10s
    host:
      idc: gke
      location: us-central1-a
    job:
      enable: false
    metrics:
      enable: true
      addr: :8000
    console: true
---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly-manager
  namespace: ate-system
  labels:
    app: dragonfly-manager
    ate.dev/image-plugin: nydus-dragonfly
spec:
  ports:
  - name: rest
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 65003
    targetPort: 65003
  selector:
    app: dragonfly-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonfly-manager
  namespace: ate-system
  labels:
    app: dragonfly-manager
    ate.dev/image-plugin: nydus-dragonfly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly-manager
  template:
    metadata:
      labels:
        app: dragonfly-manager
        ate.dev/image-plugin: nydus-dragonfly
    spec:
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      initContainers:
      - name: wait-for-db
        image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command:
        - /bin/sh
        - -ec
        - |
          until nc -z dragonfly-redis.ate-system.svc.cluster.local 6379 && nc -z dragonfly-mysql.ate-system.svc.cluster.local 3306; do
            echo "Waiting for dragonfly-redis and dragonfly-mysql..."
            sleep 2
          done
      containers:
      - name: manager
        image: dragonflyoss/manager:v2.5.3@sha256:c329042d7b79f59ca92a38bd57512f6e56c8a8a0354c855515849f38d67be227
        ports:
        - containerPort: 8080
        - containerPort: 65003
        volumeMounts:
        - name: config
          mountPath: /etc/dragonfly
      volumes:
      - name: config
        configMap:
          name: dragonfly-controlplane-config
---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly-scheduler
  namespace: ate-system
  labels:
    app: dragonfly-scheduler
    ate.dev/image-plugin: nydus-dragonfly
spec:
  ports:
  - name: grpc
    port: 8002
    targetPort: 8002
  selector:
    app: dragonfly-scheduler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonfly-scheduler
  namespace: ate-system
  labels:
    app: dragonfly-scheduler
    ate.dev/image-plugin: nydus-dragonfly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly-scheduler
  template:
    metadata:
      labels:
        app: dragonfly-scheduler
        ate.dev/image-plugin: nydus-dragonfly
    spec:
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      initContainers:
      - name: wait-for-manager
        image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command:
        - /bin/sh
        - -ec
        - |
          until nc -z dragonfly-manager.ate-system.svc.cluster.local 65003; do
            echo "Waiting for dragonfly-manager:65003..."
            sleep 2
          done
      containers:
      - name: scheduler
        image: dragonflyoss/scheduler:v2.5.3@sha256:8f5ef78dab479650723bb5f1937a92bfbac12e9e552fb2ee07979368320cc2e6
        ports:
        - containerPort: 8002
        - name: metrics
          containerPort: 8000
        volumeMounts:
        - name: config
          mountPath: /etc/dragonfly
      volumes:
      - name: config
        configMap:
          name: dragonfly-controlplane-config
---
# nydus-blob-seed serves the Nydus blobs and manifests that seed-preload.sh
# saves on each seed node, with Range support. nydusd tries it before
# dfdaemon, and the plugin reads manifests and bootstrap layers from it. A
# missing blob returns 503 because nydusd moves to the next mirror only on 5xx.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nydus-blob-seed
  namespace: ate-system
data:
  nginx.conf: |
    worker_processes auto;
    events {
      worker_connections 8192;
    }
    http {
      access_log off;
      sendfile on;
      tcp_nopush on;
      tcp_nodelay on;
      keepalive_timeout 300s;
      keepalive_requests 1000000;
      open_file_cache max=20000 inactive=10m;
      default_type application/octet-stream;
      server {
        listen 4010 reuseport;
        location = /v2 {
          return 200;
        }
        location = /v2/ {
          return 200;
        }
        location ~ "^/v2/.+/blobs/sha256:([0-9a-f]{64})$" {
          root /blobs;
          try_files /$1 =503;
        }
        location ~ "^/v2/.+/manifests/sha256:([0-9a-f]{64})$" {
          root /blobs/manifests;
          default_type application/vnd.oci.image.manifest.v1+json;
          try_files /$1 =503;
        }
        location / {
          return 503;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nydus-blob-seed
  namespace: ate-system
spec:
  selector:
    app: nydus-blob-seed
  ports:
  - name: http
    port: 4010
    targetPort: 4010
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nydus-blob-seed
  namespace: ate-system
  labels:
    app: nydus-blob-seed
spec:
  selector:
    matchLabels:
      app: nydus-blob-seed
  template:
    metadata:
      labels:
        app: nydus-blob-seed
    spec:
      hostNetwork: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: ate.dev/dragonfly-seed
                operator: In
                values:
                - "true"
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      containers:
      - name: nginx
        image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
        ports:
        - containerPort: 4010
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: blobs
          mountPath: /blobs
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: nydus-blob-seed
      - name: blobs
        hostPath:
          path: /var/lib/ate/nydus-seed-blobs
          type: DirectoryOrCreate
---
# image-plugin-nydus-dragonfly-seed runs the same pod on nodes labeled
# ate.dev/dragonfly-seed=true, where dfdaemon also registers as a super seed
# peer. When a normal peer asks for a new task, the scheduler picks a seed
# peer by hashing the task ID and asks it to fetch the task from the
# registry. A seed peer that asks for a new task fetches it itself. dfdaemon
# reads the seed label of its pod through the downward API. Both DaemonSets
# are in one List so the seed one can reuse the pod spec through a YAML
# anchor.
apiVersion: v1
kind: List
items:
- apiVersion: apps/v1
  kind: DaemonSet
  metadata:
    name: image-plugin-nydus-dragonfly
    namespace: ate-system
    labels:
      app: ate-image-plugin
      ate.dev/image-plugin: nydus-dragonfly
  spec:
    selector:
      matchLabels:
        app: ate-image-plugin
        ate.dev/image-plugin: nydus-dragonfly
        ate.dev/dragonfly-seed: "false"
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 10%
    template:
      metadata:
        labels:
          app: ate-image-plugin
          ate.dev/image-plugin: nydus-dragonfly
          ate.dev/dragonfly-seed: "false"
      spec: &pod-spec
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: ate.dev/dragonfly-seed
                  operator: NotIn
                  values:
                  - "true"
        hostPID: true
        hostNetwork: true
        terminationGracePeriodSeconds: 3600
        dnsPolicy: ClusterFirstWithHostNet
        tolerations:
        - key: ate.dev/sandboxClass
          operator: Exists
          effect: NoSchedule
        initContainers:
        # Stock Ubuntu GKE kernels build erofs and cachefiles without on-demand
        # fscache. Build both modules once per node and kernel from the exact
        # Ubuntu source of the running kernel, against the headers in the node
        # image.
        - name: build-erofs-modules
          image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
          env:
          - name: KUBE_HOME
            value: /home/kubernetes
          command:
          - /bin/bash
          - -euo
          - pipefail
          - -c
          - |
            kver="$(uname -r)"
            config="/boot/config-${kver}"
            out="${KUBE_HOME}/bin/modules/${kver}"
            if grep -qx CONFIG_EROFS_FS_ONDEMAND=y "${config}" && grep -qx CONFIG_CACHEFILES_ONDEMAND=y "${config}"; then
              echo "${kver} has on-demand EROFS and cachefiles; nothing to build."
              exit 0
            fi
            if [[ -f "${out}/erofs.ko" && -f "${out}/cachefiles.ko" ]]; then
              echo "Using existing modules in ${out}."
              exit 0
            fi

            # /proc/version_signature looks like "Ubuntu 6.8.0-1062.70-gke 6.8.12".
            read -r _ sig _ < /proc/version_signature
            version="${sig%-*}"
            src="linux-${sig##*-}"
            launchpad="https://launchpad.net/ubuntu/+archive/primary/+sourcefiles/${src}/${version}"
            pool="http://archive.ubuntu.com/ubuntu/pool/main/l/${src}"
            echo "Building on-demand erofs and cachefiles for ${kver} from ${src} ${version}."

            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              build-essential ca-certificates curl kmod libelf1t64 patchutils >/dev/null

            # The archive pool is fast but drops old diffs. Launchpad keeps
            # every version. The .dsc checksums cover both. Some archive
            # servers stall and Launchpad sometimes returns 502, so drop a
            # connection slower than 1 MB/s for 20s and try again. Each attempt
            # is a new curl, so it resolves the name again and may reach a
            # different server. -C - keeps what earlier attempts downloaded.
            fetch() {
              local name="$1" i base
              shift
              for i in {1..10}; do
                for base in "$@"; do
                  curl -fsSL -C - --speed-limit 1000000 --speed-time 20 -o "${name}" "${base}/${name}" && return 0
                done
                sleep 5
              done
              echo "FATAL: could not download ${name}." >&2
              return 1
            }
            cd /build
            fetch "${src}_${version}.dsc" "${launchpad}"
            awk '/^Checksums-Sha256:/ {f=1; next} /^[^ ]/ {f=0} f {print $1 "  " $3}' "${src}_${version}.dsc" > SHA256SUMS
            while read -r _ name; do
              fetch "${name}" "${pool}" "${launchpad}"
            done < SHA256SUMS
            sha256sum -c SHA256SUMS

            # Extract only the two module directories, then apply the Ubuntu
            # diff to them.
            mkdir src
            tar -xzf "${src}"_*.orig.tar.gz -C src --strip-components=1 --wildcards '*/fs/erofs/*' '*/fs/cachefiles/*'
            zcat "${src}_${version}.diff.gz" | filterdiff -p1 -i 'fs/erofs/*' -i 'fs/cachefiles/*' | patch -d src -p1

            # Kbuild reads the rest of the module config from the headers.
            sed -i '1i CONFIG_EROFS_FS_ONDEMAND := y\nccflags-y += -DCONFIG_EROFS_FS_ONDEMAND=1' src/fs/erofs/Makefile
            sed -i '1i CONFIG_CACHEFILES_ONDEMAND := y\nccflags-y += -DCONFIG_CACHEFILES_ONDEMAND=1' src/fs/cachefiles/Makefile
            for m in erofs cachefiles; do
              make -C "/lib/modules/${kver}/build" M="/build/src/fs/${m}" CC=x86_64-linux-gnu-gcc-13 -j"$(nproc)" modules
              vermagic="$(modinfo -F vermagic "src/fs/${m}/${m}.ko")"
              if [[ "${vermagic%% *}" != "${kver}" ]]; then
                echo "FATAL: ${m}.ko vermagic ${vermagic} does not match ${kver}." >&2
                exit 1
              fi
            done

            rm -rf "${out}.tmp"
            mkdir -p "${out}.tmp"
            cp src/fs/erofs/erofs.ko src/fs/cachefiles/cachefiles.ko "${out}.tmp/"
            rm -rf "${out}"
            mv "${out}.tmp" "${out}"
            echo "Installed erofs.ko and cachefiles.ko in ${out}."
          volumeMounts:
          - name: kube-home
            mountPath: /home/kubernetes
          - name: boot
            mountPath: /boot
            readOnly: true
          - name: lib-modules
            mountPath: /lib/modules
            readOnly: true
          - name: usr-src
            mountPath: /usr/src
            readOnly: true
          - name: kmod-build
            mountPath: /build
        containers:
        - name: dfdaemon
          image: dragonflyoss/client:v1.5.10@sha256:1025b0ef1ec1f9684600ce722f66e5776129cc42fd2dfde5784514d5b7dca942
          env:
          - name: NODE_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: SEED_PEER
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['ate.dev/dragonfly-seed']
          - name: DRAGONFLY_PREFETCH
            value: "true"
          # The proxy serves nydusd as a registry mirror. Blob requests become
          # Dragonfly tasks keyed by the blob digest, without the Range header,
          # so every Range read of a layer is a slice of one task. dfdaemon
          # fetches only the pieces a Range read needs, from peers when they
          # have them, and with prefetch fetches the rest of the task in the
          # background.
          command:
          - /bin/sh
          - -ec
          - |
            mkdir -p /etc/dragonfly /var/run/dragonfly
            cat > /etc/dragonfly/dfdaemon.yaml <<EOF
            host:
              schedulerClusterID: 1
              idc: gke
              location: us-central1-a
              ip: ${NODE_IP}
            download:
              server:
                socketPath: /var/run/dragonfly/dfdaemon.sock
              concurrentPieceCount: 16
              backToSourceConcurrentPieceCount: 16
            upload:
              server:
                port: 4000
                requestRateLimit: 10000
            manager:
              addr: http://dragonfly-manager.ate-system.svc.cluster.local:65003
            scheduler:
              announceInterval: 1m
              enableBackToSource: true
            seedPeer:
              enable: ${SEED_PEER}
              type: super
            storage:
              server:
                tcpPort: 4005
                quicPort: 4006
              dir: /var/lib/dragonfly
              keep: true
            # Tasks stay on disk for a whole run so peers can keep fetching
            # pieces from them.
            gc:
              policy:
                taskTTL: 24h
                diskHighThresholdPercent: 90
                diskLowThresholdPercent: 85
            proxy:
              server:
                ip: 127.0.0.1
                port: 4001
                # nydusd treats the 429 of the proxy rate limiter as a
                # failed read, so keep the limit out of reach.
                requestRateLimit: 100000
              rules:
              # nydusd reads ranges of at most a few chunks. With the default
              # auto policy, dfdaemon fetches ranges up to 4 MiB straight from
              # the registry and never asks the preloaded seeds.
              - regex: 'blobs/sha256.*'
                schedulingPolicy: always
              registryMirror:
                addr: https://us-central1-docker.pkg.dev
                enableTaskIDBasedBlobDigest: true
              prefetch: ${DRAGONFLY_PREFETCH}
            health:
              server:
                port: 4003
            metrics:
              server:
                port: 4002
            EOF
            exec /usr/local/bin/dfdaemon --config /etc/dragonfly/dfdaemon.yaml --console
          ports:
          - name: metrics
            containerPort: 4002
          lifecycle:
            preStop:
              exec:
                command:
                - /bin/sh
                - -c
                - while [ ! -f /run/ate/drain-complete ]; do sleep 0.5; done
          securityContext:
            privileged: true
          volumeMounts:
          - name: run-ate
            mountPath: /run/ate
          - name: var-lib-dragonfly
            mountPath: /var/lib/dragonfly
        - name: nydus-snapshotter
          image: debian:13-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
          env:
          - name: KUBE_HOME
            value: /home/kubernetes
          - name: NYDUS_VERSION
            value: "2.3.0"
          - name: NYDUS_SNAPSHOTTER_VERSION
            value: "0.15.0"
          - name: DRAGONFLY_PROXY_ADDR
            value: "http://127.0.0.1:4001"
          - name: DRAGONFLY_HEALTH_URL
            value: "http://127.0.0.1:4003/healthy"
          # In fscache mode, nydusd prefetch reads each whole blob in order.
          # Images built with a prefetch list put those files first.
          - name: NYDUS_PREFETCH
            value: "false"
          command:
          - nsenter
          - -t
          - "1"
          - -m
          - -u
          - -i
          - -n
          - --
          - /bin/bash
          - -ec
          - |
            readonly nydus_root="/var/lib/ate/image-plugin-cache/nydus-snapshotter"
            readonly nydus_run="/run/containerd-nydus"
            readonly nydusd_bin="${KUBE_HOME}/bin/nydusd"
            readonly snapshotter_bin="${KUBE_HOME}/bin/containerd-nydus-grpc"
            readonly df_addr="${DRAGONFLY_PROXY_ADDR}"
            # nydusd reads blobs from the seeds' HTTP servers first, through the
            # nydus-blob-seed Service. Kubernetes sets these from the Service.
            : "${NYDUS_BLOB_SEED_SERVICE_HOST:?}" "${NYDUS_BLOB_SEED_SERVICE_PORT:?}"
            readonly df_health="${DRAGONFLY_HEALTH_URL}"

            rm -f "${nydus_run}/containerd-nydus-grpc.sock" /run/ate/drain-complete

            # build-erofs-modules leaves on-demand builds here unless the kernel
            # already has on-demand fscache. Stock cachefiles also exports
            # cachefiles_ondemand_* tracepoints, so match whole function names
            # that only on-demand builds contain.
            has_ondemand() {
              grep -qw cachefiles_ondemand_init_object /proc/kallsyms && grep -qw erofs_fscache_register_fs /proc/kallsyms
            }
            readonly mod_dir="${KUBE_HOME}/bin/modules/$(uname -r)"
            if [[ -f "${mod_dir}/erofs.ko" ]] && ! has_ondemand; then
              modprobe -a $(modinfo -F depends "${mod_dir}/erofs.ko" "${mod_dir}/cachefiles.ko" | tr ',' '\n' | sort -u)
              for m in cachefiles erofs; do
                if [[ -d "/sys/module/${m}" ]]; then
                  rmmod "${m}"
                fi
              done
              insmod "${mod_dir}/erofs.ko"
              insmod "${mod_dir}/cachefiles.ko"
            else
              modprobe erofs
              modprobe cachefiles
            fi

            if ! has_ondemand; then
              echo "FATAL: erofs or cachefiles lacks on-demand fscache support." >&2
              exit 1
            fi

            if ! grep -qw erofs /proc/filesystems; then
              echo "FATAL: kernel EROFS is not registered in /proc/filesystems; fusedev fallback is disabled." >&2
              exit 1
            fi
            if [[ ! -e /dev/cachefiles ]]; then
              echo "FATAL: /dev/cachefiles is not available; fusedev fallback is disabled." >&2
              exit 1
            fi

            mkdir -p "${KUBE_HOME}/bin" "${nydus_root}/cache/metadata" "${nydus_root}/mnt" "${nydus_run}/docker" /run/ate

            if [[ ! -x "${nydusd_bin}" ]]; then
              curl -fsSL "https://github.com/dragonflyoss/nydus/releases/download/v${NYDUS_VERSION}/nydus-static-v${NYDUS_VERSION}-linux-amd64.tgz" \
                | tar -xz -C "${KUBE_HOME}/bin" --strip-components=1 nydus-static/nydusd nydus-static/nydus-image nydus-static/nydusify nydus-static/nydusctl
              chmod +x "${KUBE_HOME}/bin/nydusd" "${KUBE_HOME}/bin/nydus-image" "${KUBE_HOME}/bin/nydusify" "${KUBE_HOME}/bin/nydusctl"
            fi

            if [[ ! -x "${snapshotter_bin}" ]]; then
              curl -fsSL "https://github.com/containerd/nydus-snapshotter/releases/download/v${NYDUS_SNAPSHOTTER_VERSION}/nydus-snapshotter-v${NYDUS_SNAPSHOTTER_VERSION}-linux-amd64.tar.gz" \
                | tar -xz -C "${KUBE_HOME}/bin" --strip-components=1 bin/containerd-nydus-grpc bin/nydus-overlayfs
              chmod +x "${KUBE_HOME}/bin/containerd-nydus-grpc" "${KUBE_HOME}/bin/nydus-overlayfs"
            fi

            echo "Waiting for local Dragonfly dfdaemon health endpoint at ${df_health}..."
            for _ in $(seq 1 120); do
              if curl -fsS "${df_health}" >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done

            export PATH="${KUBE_HOME}/bin:${PATH}"
            export DOCKER_CONFIG="${nydus_run}/docker"
            if [[ ! -f "${DOCKER_CONFIG}/config.json" ]]; then
              echo '{"auths":{}}' > "${DOCKER_CONFIG}/config.json"
            fi

            # Clean up any stale EROFS mounts or orphaned snapshotter metadata from previous runs
            for mnt in $(awk '$3 == "erofs" {print $2}' /proc/mounts); do
              umount -l "${mnt}" 2>/dev/null || true
            done
            # nydusd views die with the old daemon. The Nydus cache layout is not
            # yet split from view state, so this clears the whole root on start.
            rm -rf "${nydus_root:?}"/* /var/lib/ate/image-plugin-cache/nydus-dragonfly/* 2>/dev/null || true
            mkdir -p "${nydus_root}/snapshots" "${nydus_root}/cache/metadata" "${nydus_root}/mnt"
            # The fscache cache files live in RAM, off the boot disk.
            if ! mountpoint -q "${nydus_root}/cache"; then
              mount -t tmpfs -o size=48g,mode=0700 tmpfs "${nydus_root}/cache"
            fi
            mkdir -p "${nydus_root}/cache/metadata"

            cat > "${nydus_root}/nydusd-config.json" <<EOF
            {
              "type": "bootstrap",
              "config": {
                "backend_type": "registry",
                "backend_config": {
                  "scheme": "https",
                  "mirrors": [
                    {
                      "host": "http://${NYDUS_BLOB_SEED_SERVICE_HOST}:${NYDUS_BLOB_SEED_SERVICE_PORT}",
                      "health_check_interval": 5,
                      "failure_limit": 5
                    },
                    {
                      "host": "${df_addr}",
                      "ping_url": "${df_health}",
                      "headers": {
                        "X-Dragonfly-Registry": "https://us-central1-docker.pkg.dev"
                      },
                      "health_check_interval": 5,
                      "failure_limit": 5
                    }
                  ],
                  "timeout": 60,
                  "connect_timeout": 10,
                  "retry_limit": 5
                },
                "cache_type": "fscache",
                "cache_config": {
                  "work_dir": "${nydus_root}/cache"
                },
                "prefetch_config": {
                  "enable": ${NYDUS_PREFETCH},
                  "threads_count": 8,
                  "merging_size": 1048576
                },
                "metadata_path": "${nydus_root}/cache/metadata"
              }
            }
            EOF

            # One shared nydusd serves every actor on the node. Its fscache
            # worker threads bound how many cache misses are fetched at once.
            cat > "${nydus_root}/config.toml" <<EOF
            version = 1
            [daemon]
            threads_number = ${NYDUS_FSCACHE_THREADS:-64}
            [metrics]
            address = ":9110"
            EOF

            rm -f "${nydus_run}/containerd-nydus-grpc.sock" /run/ate/drain-complete
            exec "${snapshotter_bin}" \
              --config="${nydus_root}/config.toml" \
              --log-level=info \
              --log-to-stdout \
              --fs-driver=fscache \
              --daemon-mode=shared \
              --nydusd="${nydusd_bin}" \
              --nydusd-config="${nydus_root}/nydusd-config.json" \
              --address="${nydus_run}/containerd-nydus-grpc.sock" \
              --root="${nydus_root}"
          lifecycle:
            preStop:
              exec:
                command:
                - /bin/sh
                - -c
                - while [ ! -f /run/ate/drain-complete ]; do sleep 0.5; done
          readinessProbe:
            exec:
              command:
              - /bin/sh
              - -c
              - test -S /run/containerd-nydus/containerd-nydus-grpc.sock && test -S /run/ate/image-plugin.sock
            initialDelaySeconds: 2
            periodSeconds: 2
          securityContext:
            privileged: true
          volumeMounts:
          - name: kube-home
            mountPath: /home/kubernetes
          - name: run-nydus
            mountPath: /run/containerd-nydus
          - name: run-ate
            mountPath: /run/ate
          - name: ate-base
            mountPath: /var/lib/ate
            mountPropagation: Bidirectional
        - name: image-plugin-dragonfly
          image: ko://go.ate.dev/substrate/image-plugin/cmd/nydus-dragonfly-preload
          env:
          - name: DRAGONFLY_PROXY_ADDR
            value: "http://127.0.0.1:4001"
          - name: DRAGONFLY_HEALTH_URL
            value: "http://127.0.0.1:4003/healthy"
          - name: DRAGONFLY_SCHEDULER_ADDR
            value: "dragonfly-scheduler.ate-system.svc.cluster.local:8002"
          - name: DRAGONFLY_MANAGER_ADDR
            value: "dragonfly-manager.ate-system.svc.cluster.local:65003"
          args:
          - --listen-socket=/run/ate/image-plugin.sock
          - --snapshotter-socket=/run/containerd-nydus/containerd-nydus-grpc.sock
          - --docker-config=/run/containerd-nydus/docker/config.json
          - --work-dir=/var/lib/ate/image-plugin-cache/nydus-dragonfly
          - --verify-dragonfly-ping=true
          - --idle-ttl=10m
          - --startup-timeout=2m
          - --drain-timeout=30m
          - --drain-complete-file=/run/ate/drain-complete
          - --blob-seed-url=http://nydus-blob-seed.ate-system.svc.cluster.local:4010
          readinessProbe:
            exec:
              command:
              - /ko-app/nydus-dragonfly-preload
              - --probe
              - --listen-socket=/run/ate/image-plugin.sock
            initialDelaySeconds: 2
            periodSeconds: 2
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
          - name: run-ate
            mountPath: /run/ate
          - name: ate-base
            mountPath: /var/lib/ate
            mountPropagation: Bidirectional
          - name: run-nydus
            mountPath: /run/containerd-nydus
        volumes:
        - name: kube-home
          hostPath:
            path: /home/kubernetes
            type: Directory
        - name: run-ate
          hostPath:
            path: /run/ate
            type: DirectoryOrCreate
        - name: ate-base
          hostPath:
            path: /var/lib/ate
            type: DirectoryOrCreate
        - name: run-nydus
          hostPath:
            path: /run/containerd-nydus
            type: DirectoryOrCreate
        - name: var-lib-dragonfly
          hostPath:
            path: /var/lib/dragonfly
            type: DirectoryOrCreate
        - name: boot
          hostPath:
            path: /boot
            type: Directory
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: usr-src
          hostPath:
            path: /usr/src
            type: Directory
        - name: kmod-build
          emptyDir: {}
- apiVersion: apps/v1
  kind: DaemonSet
  metadata:
    name: image-plugin-nydus-dragonfly-seed
    namespace: ate-system
    labels:
      app: ate-image-plugin
      ate.dev/image-plugin: nydus-dragonfly
  spec:
    selector:
      matchLabels:
        app: ate-image-plugin
        ate.dev/image-plugin: nydus-dragonfly
        ate.dev/dragonfly-seed: "true"
    updateStrategy:
      type: RollingUpdate
    template:
      metadata:
        labels:
          app: ate-image-plugin
          ate.dev/image-plugin: nydus-dragonfly
          ate.dev/dragonfly-seed: "true"
      spec:
        <<: *pod-spec
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: ate.dev/dragonfly-seed
                  operator: In
                  values:
                  - "true"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-backing-stores
  namespace: ate-system
  labels:
    ate.dev/image-plugin: nydus-dragonfly
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - dragonfly-redis
      - dragonfly-mysql
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - dragonfly-manager
          - dragonfly-scheduler
    ports:
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-controlplane-and-peers
  namespace: ate-system
  labels:
    ate.dev/image-plugin: nydus-dragonfly
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - dragonfly-manager
      - dragonfly-scheduler
      - ate-image-plugin
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 65003
    - protocol: TCP
      port: 8002
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 4000
    - protocol: TCP
      port: 4002
    - protocol: TCP
      port: 4005
    - protocol: UDP
      port: 4006
