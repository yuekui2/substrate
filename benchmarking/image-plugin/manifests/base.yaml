# Shared objects for the image plugin benchmark: the loader's namespace,
# ServiceAccount and the RBAC it needs to call ate-api-server as ate-client
# and to reach actors through atenet-router.
apiVersion: v1
kind: Namespace
metadata:
  name: imgbench
  labels:
    # ate-system admits API clients only from namespaces with this label.
    ate.dev/api-access: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loader
  namespace: imgbench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: imgbench-loader
  namespace: ate-system
rules:
- apiGroups: [""]
  resources: [serviceaccounts/token]
  resourceNames: [ate-client]
  verbs: [create]
- apiGroups: [certificates.k8s.io]
  resources: [podcertificaterequests]
  verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: imgbench-loader
  namespace: ate-system
subjects:
- kind: ServiceAccount
  name: loader
  namespace: imgbench
roleRef:
  kind: Role
  name: imgbench-loader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: imgbench-loader
rules:
- apiGroups: [certificates.k8s.io]
  resources: [clustertrustbundles]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: imgbench-loader
subjects:
- kind: ServiceAccount
  name: loader
  namespace: imgbench
roleRef:
  kind: ClusterRole
  name: imgbench-loader
  apiGroup: rbac.authorization.k8s.io
