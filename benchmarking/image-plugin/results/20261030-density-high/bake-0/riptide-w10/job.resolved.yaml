# One loader Job. run.sh fills in imgbench-bake-0-riptide-w10, riptide, bake and , "-rep", "0", "-cpu-millicores", "100", "-memory-bytes", "208037478", "-actors", "320", "-concurrency", "48"
# (extra args start with a comma). It runs on the system pool, away from the
# bench nodes. The loader lingers after it finishes so run.sh can copy
# /results out.
apiVersion: batch/v1
kind: Job
metadata:
  name: imgbench-bake-0-riptide-w10
  namespace: imgbench
  labels:
    app: imgbench-loader
    arm: riptide
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: imgbench-loader
        arm: riptide
    spec:
      restartPolicy: Never
      serviceAccountName: loader
      nodeSelector:
        cloud.google.com/gke-nodepool: bench-system
      containers:
        - name: loader
          image: us-central1-docker.pkg.dev/kuiyue-gke-dev/kuiyue-gke-dev-repo/ate-images/loader@sha256:37f71b178833756d4cd3e34616c8a1c8d822af3f18e5c436a8d2487ddf9dc212
          args: [bake, -arm, riptide, -atespace, imgbench-riptide-w10, -workload,
            bench-riptide, -snapshot-location, "gs://snapshot-substrate-test-kuiyue-gke-dev/image-plugin-bench/",
            -out, /results/out.jsonl, -linger, 2h, "-rep", "0", "-cpu-millicores",
            "100", "-memory-bytes", "208037478", "-actors", "320", "-concurrency",
            "48"]
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: results
              mountPath: /results
      volumes:
        - name: config
          configMap:
            name: imgbench-images
        - name: results
          emptyDir: {}

---
