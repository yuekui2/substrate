# One loader Job. run.sh fills in imgbench-rep-1-nydus-w2, nydus, run and , "-rep", "1", "-cpu-millicores", "500", "-memory-bytes", "1040187392", "-actors", "72", "-turns", "5", "-reads", "1000"
# (extra args start with a comma). It runs on the system pool, away from the
# bench nodes. The loader lingers after it finishes so run.sh can copy
# /results out.
apiVersion: batch/v1
kind: Job
metadata:
  name: imgbench-rep-1-nydus-w2
  namespace: imgbench
  labels:
    app: imgbench-loader
    arm: nydus
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: imgbench-loader
        arm: nydus
    spec:
      restartPolicy: Never
      serviceAccountName: loader
      nodeSelector:
        cloud.google.com/gke-nodepool: bench-system
      containers:
        - name: loader
          image: us-central1-docker.pkg.dev/kuiyue-gke-dev/kuiyue-gke-dev-repo/ate-images/loader@sha256:409d00d5ed1824801a4d90bda263cf119a3b9309e84dc758c931c8a058bcdd2c
          args: [run, -arm, nydus, -atespace, imgbench-nydus-w2, -workload, bench-nydus,
            -snapshot-location, "gs://snapshot-substrate-test-kuiyue-gke-dev/image-plugin-bench/",
            -out, /results/out.jsonl, -linger, 2h, "-rep", "1", "-cpu-millicores",
            "500", "-memory-bytes", "1040187392", "-actors", "72", "-turns", "5",
            "-reads", "1000"]
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: results
              mountPath: /results
      volumes:
        - name: config
          configMap:
            name: imgbench-images
        - name: results
          emptyDir: {}

---
