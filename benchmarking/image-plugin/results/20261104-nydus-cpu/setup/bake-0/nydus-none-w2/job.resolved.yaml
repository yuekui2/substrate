# One loader Job. run.sh fills in imgbench-bake-0-nydus-none-w2, nydus, bake and , "-rep", "0", "-cpu-millicores", "500", "-memory-bytes", "1040187392", "-images", "/config/images-96-none.jsonl", "-actors", "96", "-concurrency", "48"
# (extra args start with a comma). It runs on the system pool, away from the
# bench nodes. The loader lingers after it finishes so run.sh can copy
# /results out.
apiVersion: batch/v1
kind: Job
metadata:
  name: imgbench-bake-0-nydus-none-w2
  namespace: imgbench
  labels:
    app: imgbench-loader
    arm: nydus
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: imgbench-loader
        arm: nydus
    spec:
      restartPolicy: Never
      serviceAccountName: loader
      nodeSelector:
        cloud.google.com/gke-nodepool: bench-system
      containers:
        - name: loader
          image: us-central1-docker.pkg.dev/kuiyue-gke-dev/kuiyue-gke-dev-repo/ate-images/loader@sha256:8e8b7b5f378b2c8ad3d5f286cc4af09327103e96dd660da496316f2bc28f74ab
          args: [bake, -arm, nydus, -atespace, imgbench-nydus-none-w2, -workload,
            bench-nydus, -snapshot-location, "gs://snapshot-substrate-test-kuiyue-gke-dev/image-plugin-bench/",
            -out, /results/out.jsonl, -linger, 2h, "-rep", "0", "-cpu-millicores",
            "500", "-memory-bytes", "1040187392", "-images", "/config/images-96-none.jsonl",
            "-actors", "96", "-concurrency", "48"]
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: results
              mountPath: /results
      volumes:
        - name: config
          configMap:
            name: imgbench-images
        - name: results
          emptyDir: {}

---
