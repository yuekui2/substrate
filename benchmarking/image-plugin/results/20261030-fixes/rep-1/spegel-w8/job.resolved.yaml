# One loader Job. run.sh fills in imgbench-rep-1-spegel-w8, spegel, run and , "-rep", "1", "-cpu-millicores", "125", "-memory-bytes", "260046848", "-actors", "480", "-turns", "5", "-reads", "1000"
# (extra args start with a comma). It runs on the system pool, away from the
# bench nodes. The loader lingers after it finishes so run.sh can copy
# /results out.
apiVersion: batch/v1
kind: Job
metadata:
  name: imgbench-rep-1-spegel-w8
  namespace: imgbench
  labels:
    app: imgbench-loader
    arm: spegel
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: imgbench-loader
        arm: spegel
    spec:
      restartPolicy: Never
      serviceAccountName: loader
      nodeSelector:
        cloud.google.com/gke-nodepool: bench-system
      containers:
        - name: loader
          image: us-central1-docker.pkg.dev/kuiyue-gke-dev/kuiyue-gke-dev-repo/ate-images/loader@sha256:a3f57b9ff6e7fb9ba8c8e98e13fed5705ea08466c8f06dcc7326628faec5e237
          args: [run, -arm, spegel, -atespace, imgbench-spegel-w8, -workload, bench-spegel,
            -snapshot-location, "gs://snapshot-substrate-test-kuiyue-gke-dev/image-plugin-bench/",
            -out, /results/out.jsonl, -linger, 2h, "-rep", "1", "-cpu-millicores",
            "125", "-memory-bytes", "260046848", "-actors", "480", "-turns", "5",
            "-reads", "1000"]
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: results
              mountPath: /results
      volumes:
        - name: config
          configMap:
            name: imgbench-images
        - name: results
          emptyDir: {}

---
