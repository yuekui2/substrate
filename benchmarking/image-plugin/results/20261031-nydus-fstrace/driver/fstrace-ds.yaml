apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fstrace
  namespace: imgbench
spec:
  selector:
    matchLabels:
      app: fstrace
  template:
    metadata:
      labels:
        app: fstrace
    spec:
      hostPID: true
      nodeSelector:
        bench-arm: nydus
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      containers:
      - name: bpftrace
        image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
        command: [/bin/bash, -c, "apt-get update -qq >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bpftrace >/dev/null && echo READY && exec bpftrace /prog/fstrace.bt"]
        securityContext:
          privileged: true
        volumeMounts:
        - name: prog
          mountPath: /prog
        - name: sys
          mountPath: /sys
      volumes:
      - name: prog
        configMap:
          name: fstrace
      - name: sys
        hostPath:
          path: /sys
