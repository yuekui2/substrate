# One loader Job. run.sh fills in imgbench-bake-0-pull-w1, pull, bake and , "-rep", "0", "-cpu-millicores", "1000", "-memory-bytes", "2080374784", "-actors", "320", "-concurrency", "48"
# (extra args start with a comma). It runs on the system pool, away from the
# bench nodes. The loader lingers after it finishes so run.sh can copy
# /results out.
apiVersion: batch/v1
kind: Job
metadata:
  name: imgbench-bake-0-pull-w1
  namespace: imgbench
  labels:
    app: imgbench-loader
    arm: pull
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: imgbench-loader
        arm: pull
    spec:
      restartPolicy: Never
      serviceAccountName: loader
      nodeSelector:
        cloud.google.com/gke-nodepool: bench-system
      containers:
      - name: loader
        image: ko://go.ate.dev/substrate/benchmarking/image-plugin/loader
        args: [bake, -arm, pull, -atespace, imgbench-pull-w1, -workload, bench-pull,
          -snapshot-location, "gs://snapshot-substrate-test-kuiyue-gke-dev/image-plugin-bench/",
          -out, /results/out.jsonl, -linger, 2h , "-rep", "0", "-cpu-millicores", "1000", "-memory-bytes", "2080374784", "-actors", "320", "-concurrency", "48"]
        resources:
          requests:
            cpu: "2"
            memory: 2Gi
        volumeMounts:
        - name: config
          mountPath: /config
        - name: results
          mountPath: /results
      volumes:
      - name: config
        configMap:
          name: imgbench-images
      - name: results
        emptyDir: {}
