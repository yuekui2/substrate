---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spegel-p2p
  namespace: ate-system
  labels:
    ate.dev/image-plugin: spegel
spec:
  podSelector:
    matchLabels:
      app: ate-image-plugin
      ate.dev/image-plugin: spegel
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 5000
    - protocol: TCP
      port: 5001
