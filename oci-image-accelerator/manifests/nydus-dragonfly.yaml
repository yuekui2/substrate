# Full Cross-Node Nydus RAFS v6 + Dragonfly v2 P2P Stack over Kernel EROFS + fscache.
#
# Deploys:
# 1. Dragonfly v2 Cluster Control Plane in ate-system:
#    - dragonfly-mysql + dragonfly-redis (backing store for Dragonfly Manager)
#    - dragonfly-manager (REST :8080 / gRPC :65003)
#    - dragonfly-scheduler (gRPC :8002, P2P piece DAG & cross-node peer routing)
# 2. Per-Node Data Plane DaemonSet (ate-accelerator-nydus-dragonfly) on nodes labeled
#    ate.dev/image-accelerator=nydus-dragonfly:
#    - dfdaemon (proxy :65001 for local nydusd, upload :65000 & peer gRPC :65002
#      for cross-node P2P piece transfer over LAN, registered with dragonfly-scheduler)
#    - nydus-snapshotter (containerd-nydus-grpc + nydusd singleton in Kernel EROFS
#      + fscache mode routing all chunk requests through http://127.0.0.1:65001)
#    - accelerator-dragonfly (ImageAccelerator gRPC adapter on
#      /run/ate/image-accelerator.sock)
#
# Userspace FUSE (fusedev) fallback is strictly disabled: if Kernel EROFS or
# /dev/cachefiles is unavailable, the containers fail fast with an explicit error.
#
# On kernels without on-demand fscache, such as GKE Ubuntu, the
# build-erofs-modules init container builds erofs and cachefiles on first start
# for each kernel. It needs egress to the Ubuntu archive and launchpad.net, and
# Shielded VM secure boot off so insmod accepts the unsigned modules.
apiVersion: v1
kind: Service
metadata:
  name: dragonfly-redis
  namespace: ate-system
  labels:
    app: dragonfly-redis
    ate.dev/image-accelerator: nydus-dragonfly
spec:
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  selector:
    app: dragonfly-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonfly-redis
  namespace: ate-system
  labels:
    app: dragonfly-redis
    ate.dev/image-accelerator: nydus-dragonfly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly-redis
  template:
    metadata:
      labels:
        app: dragonfly-redis
        ate.dev/image-accelerator: nydus-dragonfly
    spec:
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      containers:
      - name: redis
        image: redis:7-alpine
        args:
        - redis-server
        - --requirepass
        - dragonfly
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly-mysql
  namespace: ate-system
  labels:
    app: dragonfly-mysql
    ate.dev/image-accelerator: nydus-dragonfly
spec:
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
  selector:
    app: dragonfly-mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonfly-mysql
  namespace: ate-system
  labels:
    app: dragonfly-mysql
    ate.dev/image-accelerator: nydus-dragonfly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly-mysql
  template:
    metadata:
      labels:
        app: dragonfly-mysql
        ate.dev/image-accelerator: nydus-dragonfly
    spec:
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: dragonfly
        - name: MYSQL_DATABASE
          value: manager
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dragonfly-controlplane-config
  namespace: ate-system
  labels:
    ate.dev/image-accelerator: nydus-dragonfly
data:
  manager.yaml: |
    server:
      rest:
        addr: :8080
      grpc:
        listenIP: 0.0.0.0
        port:
          start: 65003
          end: 65003
    auth:
      jwt:
        realm: Dragonfly
        key: ZHJhZ29uZmx5Cg==
        timeout: 48h
        maxRefresh: 48h
    database:
      type: mysql
      mysql:
        user: root
        password: dragonfly
        host: dragonfly-mysql.ate-system.svc.cluster.local
        port: 3306
        dbname: manager
        migrate: true
      redis:
        addrs:
        - dragonfly-redis.ate-system.svc.cluster.local:6379
        password: dragonfly
        db: 0
        brokerDB: 1
        backendDB: 2
    cache:
      redis:
        ttl: 30s
      local:
        size: 10000
        ttl: 30s
    security:
      autoIssueCert: false
      tlsPolicy: default
    metrics:
      enable: false
    console: true
  scheduler.yaml: |
    server:
      listenIP: 0.0.0.0
      port: 8002
      advertisePort: 8002
    scheduler:
      algorithm: default
      backToSourceCount: 200
      retryBackToSourceLimit: 5
      retryLimit: 10
      retryInterval: 50ms
      gc:
        peerGCInterval: 10m
        peerTTL: 24h
        taskGCInterval: 10m
        hostGCInterval: 30m
        hostTTL: 48h
    manager:
      addr: dragonfly-manager.ate-system.svc.cluster.local:65003
      schedulerClusterID: 1
      keepAlive:
        interval: 5s
    dynConfig:
      refreshInterval: 10s
    host:
      idc: gke
      location: us-central1-a
    job:
      enable: false
    metrics:
      enable: false
    console: true
---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly-manager
  namespace: ate-system
  labels:
    app: dragonfly-manager
    ate.dev/image-accelerator: nydus-dragonfly
spec:
  ports:
  - name: rest
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 65003
    targetPort: 65003
  selector:
    app: dragonfly-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonfly-manager
  namespace: ate-system
  labels:
    app: dragonfly-manager
    ate.dev/image-accelerator: nydus-dragonfly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly-manager
  template:
    metadata:
      labels:
        app: dragonfly-manager
        ate.dev/image-accelerator: nydus-dragonfly
    spec:
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command:
        - /bin/sh
        - -ec
        - |
          until nc -z dragonfly-redis.ate-system.svc.cluster.local 6379 && nc -z dragonfly-mysql.ate-system.svc.cluster.local 3306; do
            echo "Waiting for dragonfly-redis and dragonfly-mysql..."
            sleep 2
          done
      containers:
      - name: manager
        image: dragonflyoss/manager:v2.1.49
        ports:
        - containerPort: 8080
        - containerPort: 65003
        volumeMounts:
        - name: config
          mountPath: /etc/dragonfly
      volumes:
      - name: config
        configMap:
          name: dragonfly-controlplane-config
---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly-scheduler
  namespace: ate-system
  labels:
    app: dragonfly-scheduler
    ate.dev/image-accelerator: nydus-dragonfly
spec:
  ports:
  - name: grpc
    port: 8002
    targetPort: 8002
  selector:
    app: dragonfly-scheduler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonfly-scheduler
  namespace: ate-system
  labels:
    app: dragonfly-scheduler
    ate.dev/image-accelerator: nydus-dragonfly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly-scheduler
  template:
    metadata:
      labels:
        app: dragonfly-scheduler
        ate.dev/image-accelerator: nydus-dragonfly
    spec:
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      initContainers:
      - name: wait-for-manager
        image: busybox:1.36
        command:
        - /bin/sh
        - -ec
        - |
          until nc -z dragonfly-manager.ate-system.svc.cluster.local 65003; do
            echo "Waiting for dragonfly-manager:65003..."
            sleep 2
          done
      containers:
      - name: scheduler
        image: dragonflyoss/scheduler:v2.1.49
        ports:
        - containerPort: 8002
        volumeMounts:
