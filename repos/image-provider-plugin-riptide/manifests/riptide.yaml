# The Riptide image provider plugin, on every worker node.
#
# riptide-provider runs the DaemonSet's own gcfsd and containerd-gcfs-grpc
# (manifests/scripts/start-riptide.sh), apart from the host's. Its state
# lives under /var/lib/ate/image-plugin-cache/riptide-gcfs and its sockets
# under /run/ate. image-provider-riptide serves the plugin API on
# /run/ate/image-provider.sock.
#
# The binaries come from the node: GKE preloads gcfsd, gcfsd-v2 and
# containerd-gcfs-grpc under /home/kubernetes/bin. Set RIPTIDE_BIN_DIR to a
# node directory to run other builds. cmd/riptide-bin-image packages custom
# builds and writes a patch that installs them there.
#
# On SIGTERM the plugin drains its leases and writes /run/ate/drain-complete.
# riptide-provider keeps gcfsd running until then.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: image-provider-riptide
  labels:
    app: ate-image-provider
spec:
  selector:
    matchLabels:
      app: ate-image-provider
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app: ate-image-provider
    spec:
      hostPID: true
      hostNetwork: true
      terminationGracePeriodSeconds: 3600
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      containers:
      - name: riptide-provider
        image: debian:13-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
        command:
        - /scripts/start-riptide.sh
        env:
        - name: KUBE_HOME
          value: /home/kubernetes
        # Node directory with custom gcfsd, gcfsd-v2 and containerd-gcfs-grpc
        # builds. Unset means ${KUBE_HOME}/bin. It must be on an exec mount;
        # /var is noexec on Container-Optimized OS.
        # - name: RIPTIDE_BIN_DIR
        #   value: /home/kubernetes/bin/ate-riptide
        - name: ENABLE_GCFS_V2_API
          value: "true"
        - name: ENABLE_GCFS_LAYER_CACHING
          value: "true"
        - name: ENABLE_USERNAMESPACE_SUPPORT
          value: "false"
        # "true" clears the layer cache at every start.
        - name: CLEAR_CACHE_ON_START
          value: "false"
        # gcfsd memory cache size. Unset means gcfsd's default.
        # - name: GCFSD_CACHE_SIZE_MIB
        #   value: "2048"
        securityContext:
          privileged: true
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: run-ate
          mountPath: /run/ate
        - name: ate-base
          mountPath: /var/lib/ate
          mountPropagation: Bidirectional
      - name: image-provider-riptide
        image: ko://github.com/ai-on-gke/image-provider-plugin-riptide/cmd/image-provider-riptide
        args:
        - --listen-socket=/run/ate/image-provider.sock
        - --snapshotter-socket=/run/ate/gcfs-snapshotter.sock
        - --keychain-socket=/run/ate/gcfsd/keychain.sock
        - --drain-complete-file=/run/ate/drain-complete
        readinessProbe:
          exec:
            command:
            - /ko-app/image-provider-riptide
            - --probe
            - --listen-socket=/run/ate/image-provider.sock
          initialDelaySeconds: 2
          periodSeconds: 2
        securityContext:
          privileged: true
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: run-ate
          mountPath: /run/ate
        - name: ate-base
          mountPath: /var/lib/ate
          mountPropagation: HostToContainer
      volumes:
      - name: scripts
        configMap:
          name: image-provider-riptide-scripts
          defaultMode: 0755
      - name: run-ate
        hostPath:
          path: /run/ate
          type: DirectoryOrCreate
      - name: ate-base
        hostPath:
          path: /var/lib/ate
          type: DirectoryOrCreate
