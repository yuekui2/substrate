# Based on the Agent Substrate config, without its repository-specific rules.

version: "2"

run:
  timeout: 5m

linters:
  default: standard

  enable:
    # Spelling errors in comments, strings, and identifiers.
    - misspell

  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint

    misspell:
      locale: US
      mode: restricted # comments only
      ignore-rules:
        - cancelled

  exclusions:
    presets:
      - common-false-positives
      - legacy

    rules:
      # Generated code.
      - path: '\.pb\.go$'
        linters: [errcheck, govet, ineffassign, staticcheck, unused]
      # Tests routinely discard error returns from setup helpers.
      - path: '_test\.go'
        linters:
          - errcheck
      # Quickfix suggestions are stylistic rewrites, not bugs.
      - linters: [staticcheck]
        text: '^QF[0-9]+'
      # Deferred Close() and os.Remove calls in cleanup paths.
      - linters: [errcheck]
        text: 'Error return value of `[^`]+\.Close` is not checked'
      - linters: [errcheck]
        text: 'Error return value of `os\.Remove` is not checked'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
