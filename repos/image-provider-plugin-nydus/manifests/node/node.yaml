# image-provider-nydus runs on every node that is not a Dragonfly seed:
#   - dfdaemon, the Dragonfly peer. Its registry mirror proxy listens on
#     127.0.0.1:4001 for nydusd and the plugin, upload gRPC on :4000,
#     piece storage on :4005/tcp and :4006/udp, metrics on :4002 and
#     health on :4003.
#   - nydus-snapshotter, containerd-nydus-grpc with one shared nydusd in
#     EROFS over fscache mode.
#   - image-provider, the plugin, on /run/ate/image-provider.sock.
#
# On kernels without on-demand fscache, such as GKE Ubuntu, the
# build-erofs-modules init container builds erofs and cachefiles on first
# start for each kernel. It needs egress to the Ubuntu archive and
# launchpad.net, and secure boot off so insmod accepts the unsigned
# modules.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: image-provider-nydus
  labels:
    app: ate-image-provider
spec:
  selector:
    matchLabels:
      app: ate-image-provider
      ate.dev/dragonfly-seed: "false"
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app: ate-image-provider
        ate.dev/dragonfly-seed: "false"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: ate.dev/dragonfly-seed
                operator: NotIn
                values:
                - "true"
      hostPID: true
      hostNetwork: true
      # The plugin drains image leases for up to --drain-timeout.
      terminationGracePeriodSeconds: 3600
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      initContainers:
      - name: build-erofs-modules
        image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
        command:
        - /scripts/build-erofs-modules.sh
        env:
        - name: KUBE_HOME
          value: /home/kubernetes
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: kube-home
          mountPath: /home/kubernetes
        - name: boot
          mountPath: /boot
          readOnly: true
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
        - name: usr-src
          mountPath: /usr/src
          readOnly: true
        - name: kmod-build
          mountPath: /build
      containers:
      - name: dfdaemon
        image: dragonflyoss/client:v1.5.10@sha256:1025b0ef1ec1f9684600ce722f66e5776129cc42fd2dfde5784514d5b7dca942
        command:
        - /scripts/dfdaemon.sh
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: SEED_PEER
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['ate.dev/dragonfly-seed']
        envFrom:
        - configMapRef:
            name: image-provider-nydus-config
        ports:
        - name: metrics
          containerPort: 4002
        lifecycle:
          preStop:
            exec:
              command:
              - /scripts/wait-drain.sh
        securityContext:
          privileged: true
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: run-ate
          mountPath: /run/ate
        - name: var-lib-dragonfly
          mountPath: /var/lib/dragonfly
      - name: nydus-snapshotter
        image: debian:13-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
        command:
        - /scripts/nydus-snapshotter.sh
        env:
        - name: KUBE_HOME
          value: /home/kubernetes
        envFrom:
        - configMapRef:
            name: image-provider-nydus-config
        lifecycle:
          preStop:
            exec:
              command:
              - /scripts/wait-drain.sh
        readinessProbe:
          exec:
            command:
            - test
            - -S
            - /run/containerd-nydus/containerd-nydus-grpc.sock
          initialDelaySeconds: 2
          periodSeconds: 2
        securityContext:
          privileged: true
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: kube-home
          mountPath: /home/kubernetes
        - name: run-nydus
          mountPath: /run/containerd-nydus
        - name: run-ate
          mountPath: /run/ate
        - name: ate-base
          mountPath: /var/lib/ate
          mountPropagation: Bidirectional
      - name: image-provider
        image: ko://github.com/ai-on-gke/image-provider-plugin-nydus/cmd/image-provider-nydus
        readinessProbe:
          exec:
            command:
            - /ko-app/image-provider-nydus
            - --probe
          initialDelaySeconds: 2
          periodSeconds: 2
        securityContext:
          privileged: true
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: run-ate
          mountPath: /run/ate
        - name: ate-base
          mountPath: /var/lib/ate
          mountPropagation: Bidirectional
        - name: run-nydus
          mountPath: /run/containerd-nydus
      volumes:
      - name: scripts
        configMap:
          name: image-provider-nydus-scripts
          defaultMode: 0555
      - name: kube-home
        hostPath:
          path: /home/kubernetes
          type: Directory
      - name: run-ate
        hostPath:
          path: /run/ate
          type: DirectoryOrCreate
      - name: ate-base
        hostPath:
          path: /var/lib/ate
          type: DirectoryOrCreate
      - name: run-nydus
        hostPath:
          path: /run/containerd-nydus
          type: DirectoryOrCreate
      - name: var-lib-dragonfly
        hostPath:
          path: /var/lib/dragonfly
          type: DirectoryOrCreate
      - name: boot
        hostPath:
          path: /boot
          type: Directory
      - name: lib-modules
        hostPath:
          path: /lib/modules
          type: Directory
      - name: usr-src
        hostPath:
          path: /usr/src
          type: Directory
      - name: kmod-build
        emptyDir: {}
