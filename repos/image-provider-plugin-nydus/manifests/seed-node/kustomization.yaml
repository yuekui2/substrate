# image-provider-nydus-seed runs the node pod on nodes labeled
# ate.dev/dragonfly-seed=true, where dfdaemon also registers as a super
# seed peer. When a normal peer asks for a new task, the scheduler picks a
# seed peer by hashing the task ID and has it fetch the task from the
# registry. dfdaemon reads the seed label of its pod through the downward
# API. Seed nodes are few, so they update one at a time.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../node

nameSuffix: -seed

labels:
- pairs:
    ate.dev/dragonfly-seed: "true"
  includeSelectors: true

patches:
- target:
    kind: DaemonSet
    name: image-provider-nydus
  patch: |-
    - op: replace
      path: /spec/template/spec/affinity/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution/nodeSelectorTerms/0/matchExpressions/0/operator
      value: In
    - op: replace
      path: /spec/updateStrategy
      value:
        type: RollingUpdate
