apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The Dragonfly config and the scripts name Services in ate-system.
namespace: ate-system

labels:
- pairs:
    ate.dev/image-provider: nydus
  includeTemplates: true

resources:
- dragonfly.yaml
- node

configMapGenerator:
- name: image-provider-nydus-config
  literals:
  # The registry that nydusd and dfdaemon mirror. Set it to the registry
  # of your Nydus images.
  - REGISTRY_URL=https://us-central1-docker.pkg.dev
- name: image-provider-nydus-scripts
  files:
  - scripts/build-erofs-modules.sh
  - scripts/dfdaemon.sh
  - scripts/nydus-snapshotter.sh
  - scripts/wait-drain.sh
  - scripts/wait-for.sh
