# Dragonfly v2.5 control plane. The manager keeps cluster state in MySQL
# and Redis. The scheduler tells each node's dfdaemon which peers have the
# pieces it needs.
#
# MySQL runs as a sidecar of the manager, on an emptyDir. The manager
# creates its tables only at startup, so the database lives and dies with
# the manager pod.
apiVersion: v1
kind: Service
metadata:
  name: dragonfly-redis
  labels:
    app: dragonfly-redis
spec:
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  selector:
    app: dragonfly-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonfly-redis
  labels:
    app: dragonfly-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly-redis
  template:
    metadata:
      labels:
        app: dragonfly-redis
    spec:
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      containers:
      - name: redis
        image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        args:
        - redis-server
        - --requirepass
        - dragonfly
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dragonfly-controlplane-config
data:
  manager.yaml: |
    server:
      rest:
        addr: :8080
      grpc:
        listenIP: 0.0.0.0
        port:
          start: 65003
          end: 65003
    auth:
      jwt:
        realm: Dragonfly
        key: ZHJhZ29uZmx5Cg==
        timeout: 48h
        maxRefresh: 48h
    database:
      type: mysql
      mysql:
        user: root
        password: dragonfly
        host: 127.0.0.1
        port: 3306
        dbname: manager
        migrate: true
      redis:
        addrs:
        - dragonfly-redis.ate-system.svc.cluster.local:6379
        password: dragonfly
        db: 0
        brokerDB: 1
        backendDB: 2
    cache:
      redis:
        ttl: 30s
      local:
        size: 10000
        ttl: 30s
    metrics:
      enable: false
    console: true
  scheduler.yaml: |
    server:
      listenIP: 0.0.0.0
      port: 8002
      advertisePort: 8002
    scheduler:
      algorithm: default
      # At most backToSourceCount peers of a task fetch from the registry.
      # The rest download pieces from them. The seeds are preloaded, so a
      # peer rarely finds no parent. When it does, it goes to the registry
      # after one retry.
      backToSourceCount: 3
      retryBackToSourceLimit: 1
      retryLimit: 20
      retryInterval: 100ms
      gc:
        pieceDownloadTimeout: 30m
        peerGCInterval: 10m
        peerTTL: 24h
        taskGCInterval: 10m
        hostGCInterval: 30m
        hostTTL: 48h
    manager:
      addr: dragonfly-manager.ate-system.svc.cluster.local:65003
      schedulerClusterID: 1
      keepAlive:
        interval: 5s
    dynConfig:
      refreshInterval: 10s
    job:
      enable: false
    metrics:
      enable: true
      addr: :8000
    console: true
---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly-manager
  labels:
    app: dragonfly-manager
spec:
  ports:
  - name: rest
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 65003
    targetPort: 65003
  selector:
    app: dragonfly-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonfly-manager
  labels:
    app: dragonfly-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly-manager
  template:
    metadata:
      labels:
        app: dragonfly-manager
    spec:
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      initContainers:
      # The manager starts once MySQL answers on TCP, which the image's
      # entrypoint allows only after it has created the database.
      - name: mysql
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        restartPolicy: Always
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: dragonfly
        - name: MYSQL_DATABASE
          value: manager
        startupProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - --host=127.0.0.1
            - --password=dragonfly
          periodSeconds: 2
          failureThreshold: 150
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
      - name: wait-for-redis
        image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command:
        - /scripts/wait-for.sh
        - dragonfly-redis.ate-system.svc.cluster.local:6379
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      containers:
      - name: manager
        image: dragonflyoss/manager:v2.5.3@sha256:c329042d7b79f59ca92a38bd57512f6e56c8a8a0354c855515849f38d67be227
        ports:
        - containerPort: 8080
        - containerPort: 65003
        volumeMounts:
        - name: config
          mountPath: /etc/dragonfly
      volumes:
      - name: config
        configMap:
          name: dragonfly-controlplane-config
      - name: scripts
        configMap:
          name: image-provider-nydus-scripts
          defaultMode: 0555
      - name: mysql-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly-scheduler
  labels:
    app: dragonfly-scheduler
spec:
  ports:
  - name: grpc
    port: 8002
    targetPort: 8002
  selector:
    app: dragonfly-scheduler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonfly-scheduler
  labels:
    app: dragonfly-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly-scheduler
  template:
    metadata:
      labels:
        app: dragonfly-scheduler
    spec:
      tolerations:
      - key: ate.dev/sandboxClass
        operator: Exists
        effect: NoSchedule
      initContainers:
      - name: wait-for-manager
        image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command:
        - /scripts/wait-for.sh
        - dragonfly-manager.ate-system.svc.cluster.local:65003
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      containers:
      - name: scheduler
        image: dragonflyoss/scheduler:v2.5.3@sha256:8f5ef78dab479650723bb5f1937a92bfbac12e9e552fb2ee07979368320cc2e6
        ports:
        - containerPort: 8002
        - name: metrics
          containerPort: 8000
        volumeMounts:
        - name: config
          mountPath: /etc/dragonfly
      volumes:
      - name: config
        configMap:
          name: dragonfly-controlplane-config
      - name: scripts
        configMap:
          name: image-provider-nydus-scripts
          defaultMode: 0555
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-backing-stores
spec:
  podSelector:
    matchLabels:
      app: dragonfly-redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - dragonfly-manager
          - dragonfly-scheduler
    ports:
    - protocol: TCP
      port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-controlplane
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - dragonfly-manager
      - dragonfly-scheduler
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 65003
    - protocol: TCP
      port: 8002
    - protocol: TCP
      port: 8000
---
# hostNetwork pods are outside most NetworkPolicy implementations. This
# policy covers the dfdaemon ports where they are not.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: image-provider-nydus-peers
spec:
  podSelector:
    matchLabels:
      app: ate-image-provider
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 4000
    - protocol: TCP
      port: 4002
    - protocol: TCP
      port: 4005
    - protocol: UDP
      port: 4006
