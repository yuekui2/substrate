syntax = "proto3";

package imageprovider.v1alpha1;

option go_package = "github.com/ai-on-gke/image-provider-plugin/api/imageprovider/v1alpha1;imageprovider";

// ImageProviderPlugin is a node-local gRPC service that an image provider
// plugin serves on a Unix domain socket, for example to stream images with
// Riptide or Nydus.
//
// Given an OCI image reference and resolved registry credentials, the plugin
// prepares the image's layers on the host in the requested LayerForm and
// returns them in order for container rootfs composition.
service ImageProviderPlugin {
  // CanProvide reports whether the plugin and its provider are healthy and
  // able to serve the given OCI image in the requested form.
  rpc CanProvide(CanProvideRequest) returns (CanProvideResponse);

  // PrepareImage prepares the image's layers in the requested form, takes a
  // lease on the image, and returns the complete ordered list of read-only
  // layers.
  //
  // If the plugin cannot serve the image, PrepareImage returns
  // codes.FailedPrecondition so the caller can fall back to pulling the whole
  // image itself.
  rpc PrepareImage(PrepareImageRequest) returns (PrepareImageResponse);

  // ReleaseImage releases one lease on the image, when a workload
  // checkpoints, suspends or terminates. The plugin may remove the image's
  // layers once no lease is left.
  rpc ReleaseImage(ReleaseImageRequest) returns (ReleaseImageResponse);

  // ReconcileImages replaces the plugin's leases with the images that
  // surviving workloads still use. The caller sends it after it restarts or
  // finds the plugin socket. The plugin removes layers that no workload uses.
  rpc ReconcileImages(ReconcileImagesRequest) returns (ReconcileImagesResponse);
}

// LayerForm is the form in which the plugin returns an image's layers.
enum LayerForm {
  // LAYER_FORM_UNSPECIFIED is treated as LAYER_FORM_DIRS.
  LAYER_FORM_UNSPECIFIED = 0;

  // LAYER_FORM_DIRS returns mounted read-only host directories, stacked on
  // the host as overlayfs lowerdirs.
  LAYER_FORM_DIRS = 1;

  // LAYER_FORM_EROFS returns EROFS image files that a microVM maps over
  // virtio-pmem with DAX and stacks inside the guest. Each file is
  // uncompressed with a 4 KiB block size and stays unchanged while the image
  // is leased.
  LAYER_FORM_EROFS = 2;
}

// RegistryAuth carries resolved registry credentials, for example from a
// kubelet credential provider or imagePullSecrets, for one image request.
message RegistryAuth {
  string username = 1;
  string password = 2 [ debug_redact = true ];
  string auth = 3 [ debug_redact = true ];
  string server_address = 4;
  string identity_token = 5 [ debug_redact = true ];
  string registry_token = 6 [ debug_redact = true ];
}

message CanProvideRequest {
  string image_ref = 1;
  RegistryAuth auth = 2;

  // form is the layer form the caller needs. A plugin that cannot
  // produce it returns can_provide = false.
  LayerForm form = 3;
}

// PluginState is the plugin's lifecycle state on the node. A caller treats
// PLUGIN_STATE_UNSPECIFIED and values it does not know as "do not use the
// plugin, and do not evict workloads".
enum PluginState {
  PLUGIN_STATE_UNSPECIFIED = 0;

  // PLUGIN_STATE_SERVING means the plugin serves PrepareImage normally.
  PLUGIN_STATE_SERVING = 1;

  // PLUGIN_STATE_DRAINING means the plugin is shutting down, for example
  // after SIGTERM during a RollingUpdate. It declines PrepareImage, and
  // workloads holding its leases should cycle so it can unmount.
  PLUGIN_STATE_DRAINING = 2;
}

message CanProvideResponse {
  // can_provide reports whether the plugin can serve this image.
  bool can_provide = 1;
  string provider_name = 2;

  // state is the plugin's lifecycle state. It does not depend on the image.
  PluginState state = 3;
}

message PrepareImageRequest {
  string image_ref = 1;
  RegistryAuth auth = 2;

  // form is the layer form to return.
  LayerForm form = 3;

  // required_erofs_digests, if set, lists in order the EROFS image digests
  // ("sha256:<hex>") that a snapshot being restored mapped. The plugin
  // returns exactly these images or codes.FailedPrecondition. Only valid with
  // LAYER_FORM_EROFS.
  repeated string required_erofs_digests = 4;
}

// ErofsLayer is one read-only EROFS image file on the host.
message ErofsLayer {
  // path is the host path of the image file.
  string path = 1;

  // digest is the sha256 of the file ("sha256:<hex>").
  string digest = 2;
}

message PrepareImageResponse {
  // image_digest is the resolved OCI manifest digest ("sha256:<hex>").
  string image_digest = 1;

  // config_json is the JSON-encoded OCI v1.Config (entrypoint, cmd, env, user,
  // working_dir) for the resolved image.
  bytes config_json = 2;

  // layer_dirs contains the complete ordered list of read-only host layer
  // directories (bottom-most base layer first, matching OCI manifest order).
  // Set for LAYER_FORM_DIRS.
  repeated string layer_dirs = 3;

  // provider_name identifies the image provider, for example "riptide" or
  // "nydus".
  string provider_name = 4;

  // erofs_layers contains the complete ordered list of EROFS image files,
  // bottom-most first. The plugin may return one file per OCI layer or
  // fewer merged files. Set for LAYER_FORM_EROFS.
  repeated ErofsLayer erofs_layers = 5;
}

message ReleaseImageRequest {
  string image_ref = 1;
}

message ReleaseImageResponse {}

// ActiveImageLayers is one image that surviving workloads still use.
message ActiveImageLayers {
  string image_ref = 1;
  string image_digest = 2;
  repeated string layer_dirs = 3;

  // ref_count is the number of workloads that use the image.
  int32 ref_count = 4;
}

message ReconcileImagesRequest {
  repeated ActiveImageLayers active_images = 1;
}

message ReconcileImagesResponse {}
